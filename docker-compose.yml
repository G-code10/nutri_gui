services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: unless-stopped
    env_file: db.env            # POSTGRES_PASSWORD (et POSTGRES_USER, POSTGRES_DB s'ils sont définis) viennent de db.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: