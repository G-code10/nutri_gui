# Fiche idendité du projet
# permet l'appel de fonction depuis n'importe quel endroit du dossier, faire pip install -e avant pour ajouter les dossier dans le venv

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nutriscope"
version = "0.3.0"
description = "Nutriscope: application de conseil et renseignement nutritionnel"
readme = "README.md"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
include = ["nutriscope*", "src*"]